    /* =========================================================================
       2. General Reset & Typography
       ========================================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --primary-dark: #0f172a;
      --accent: #0284c7;
      --bg-page: #f1f5f9;
      --border-color: #cbd5e1;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --sheet-font-size: 12pt;
    }

    body {
      font-family: 'Pinar', Tahoma, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      direction: rtl;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================================
       3. Screen Control Panel (Hidden during Print)
       ========================================================================= */
    .control-panel {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid #e2e8f0;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      padding: 12px 20px;
      margin-bottom: 20px;
    }

    .panel-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .panel-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-badge {
      background: var(--primary);
      color: #fff;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-primary {
      background: #059669;
      color: #fff;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25);
    }

    .btn-primary:hover {
      background: #047857;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f8fafc;
      color: #334155;
      border-color: #cbd5e1;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-toggle {
      background: #f1f5f9;
      color: #1e293b;
      border: 1.5px solid #94a3b8;
    }

    .btn-toggle.active {
      background: #1e40af;
      color: #fff;
      border-color: #1e40af;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px 14px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-text {
      width: 100%;
      padding: 5px 8px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      background: #fff;
    }

    .input-text:focus {
      border-color: var(--primary-light);
      outline: none;
    }

    .input-number {
      width: 60px;
      padding: 4px 6px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      text-align: center;
    }

    .input-range {
      flex: 1;
      cursor: pointer;
    }

    .select-dropdown {
      padding: 5px 8px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.84rem;
      background: #fff;
      cursor: pointer;
    }

    /* Lessons Filter Bar */
    .filter-bar {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.85rem;
    }

    .filter-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 3px 8px;
      font-size: 0.78rem;
      border-radius: 5px;
    }

    .lesson-selector-drawer {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 8px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 4px;
    }

    .lesson-checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: background 0.15s;
    }

    .lesson-checkbox-label:hover {
      background: #f1f5f9;
    }

    .lesson-custom-input {
      width: 40px;
      padding: 2px 4px;
      font-size: 0.78rem;
      text-align: center;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      margin-right: auto;
    }

    /* =========================================================================
       4. Printable Worksheet Page (A4)
       ========================================================================= */
    .worksheets-container {
      max-width: 210mm;
      margin: 0 auto 30px auto;
    }

    .worksheet-page {
      background: #ffffff;
      width: 210mm;
      min-height: 297mm;
      padding: 12mm 14mm 12mm 14mm;
      margin: 0 auto 24px auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1.5px solid #475569;
      box-sizing: border-box;
      page-break-after: always;
      page-break-inside: avoid;
    }

    /* Compact & Clean Header styling */
    .sheet-header {
      border: 1.5px solid #1e293b;
      border-radius: 6px;
      padding: 6px 12px;
      margin-bottom: 4px;
      background: #fff;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #94a3b8;
      padding-bottom: 5px;
      margin-bottom: 5px;
    }

    .header-right {
      font-size: 0.78rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
      white-space: nowrap;
    }

    .header-center {
      text-align: center;
      flex-grow: 1;
      padding: 0 6px;
    }

    .sheet-main-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
    }

    .sheet-sub-title {
      font-size: 0.76rem;
      color: #475569;
      font-weight: 600;
      margin-top: 1px;
      white-space: nowrap;
    }

    .teacher-badge {
      display: inline-block;
      background: #dc2626;
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 2px;
      font-weight: 700;
    }

    .header-left {
      text-align: left;
      font-size: 0.78rem;
      color: #0f172a;
      line-height: 1.35;
      white-space: nowrap;
    }

    .header-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      gap: 10px;
      padding: 3px 0 5px 0;
      border-bottom: 1px dashed #cbd5e1;
      white-space: nowrap;
    }

    .meta-item {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }

    .meta-item.student-name {
      flex: 1 1 auto;
      max-width: 240px;
    }

    .meta-label {
      font-weight: 700;
      color: #334155;
    }

    .meta-val {
      font-weight: 700;
      color: #0f172a;
    }

    .meta-dots {
      display: inline-block;
      border-bottom: 1px dotted #334155;
      min-width: 90px;
      flex-grow: 1;
      height: 0.8em;
    }

    .meta-dots.date-dots {
      min-width: 65px;
      flex-grow: 0;
    }

    .meta-dots.sig-dots {
      min-width: 140px;
      flex-grow: 1;
    }

    .header-eval-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      padding-top: 4px;
      white-space: nowrap;
    }

    .eval-levels {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .eval-grade {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .eval-circle {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 1.5px solid #475569;
      border-radius: 50%;
      background: #fff;
    }

    /* New small row directly under header */
    .sub-header-credit {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 8px;
      letter-spacing: -0.1px;
      direction: rtl;
    }

    .instruction-line {
      font-size: 0.8rem;
      color: #1e293b;
      margin-bottom: 12px;
      padding: 3px 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Worksheet Content Body - Natural Persian flow without giant gaps */
    .sheet-body {
      flex: 1;
      font-size: var(--sheet-font-size);
      line-height: 2.3;
      color: #000;
      text-align: right;
      word-spacing: normal;
    }

    .sheet-body.align-justify {
      text-align: justify;
      text-justify: inter-word;
    }

    .prose-paragraph {
      margin-bottom: 12px;
      text-indent: 20px;
    }

    /* Poem layout */
    .poem-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px auto;
      max-width: 95%;
    }

    .couplet-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 6px;
      border-bottom: 1px dotted #e2e8f0;
      page-break-inside: avoid;
    }

    .hemistich {
      width: 48%;
      text-align: center;
    }

    .hemistich-1 {
      text-align: left;
      padding-left: 8px;
    }

    .hemistich-2 {
      text-align: right;
      padding-right: 8px;
    }

    .stanza-block {
      margin-bottom: 10px;
      padding: 5px 10px;
      background: #fafafa;
      border-radius: 4px;
      page-break-inside: avoid;
    }

    /* Blank Style: Natural Parentheses with Dotted Line (Doubled in Size) */
    .cloze-blank {
      display: inline-block;
      direction: rtl;
      vertical-align: baseline;
      margin: 0 2px;
      white-space: nowrap;
    }

    .cloze-paren {
      font-weight: 700;
      color: #0f172a;
      font-size: 1.05em;
      padding: 0;
    }

    .cloze-dotted-line {
      display: inline-block;
      border-bottom: 2px dotted #1e293b;
      height: 0.85em;
      margin: 0 2px;
      vertical-align: baseline;
    }

    /* Answer in Teacher Mode */
    .cloze-answer {
      display: inline-block;
      font-weight: 700;
      color: #047857;
      border-bottom: 1.5px dotted #047857;
      padding: 0 4px;
    }

    /* Word Bank (Optional Helper) */
    .word-bank-box {
      margin-top: 14px;
      border: 1.5px dashed #64748b;
      border-radius: 6px;
      padding: 6px 10px;
      background: #f8fafc;
      page-break-inside: avoid;
    }

    .word-bank-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
    }

    .word-bank-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .word-chip {
      background: #fff;
      border: 1px solid #cbd5e1;
      padding: 1px 8px;
      border-radius: 4px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #1e293b;
    }

    /* =========================================================================
       5. Print Media Queries (@media print)
       ========================================================================= */
    @page {
      size: A4 portrait;
      margin: 10mm 12mm 10mm 12mm;
    }

    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }

      .control-panel,
      .no-print {
        display: none !important;
      }

      .worksheets-container {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .worksheet-page {
        width: 100% !important;
        min-height: auto !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        display: block !important;
        page-break-after: always !important;
        page-break-inside: avoid !important;
        box-sizing: border-box !important;
      }

      .sheet-body {
        color: #000 !important;
      }

      .sheet-header {
        border-color: #000 !important;
      }

      .sub-header-credit {
        color: #64748b !important;
        font-size: 6.8pt !important;
      }

      .cloze-dotted-line {
        border-bottom: 2px dotted #000 !important;
      }

      .cloze-answer {
        color: #000 !important;

      }

      .couplet-row,
      .stanza-block,
      .prose-paragraph {
        page-break-inside: avoid !important;

          "توفیق"
        ]
      }
    ];

    // Default configuration state
    const DEFAULT_CONFIG = {
      globalBlankCount: 8,
      teacherMode: false,
      wordBank: "none",
      fontSize: "12pt",
      textAlign: "right",
      schoolName: "شهید قائمی پائین‌رودپشت",
      teacherName: "علی یعقوبی جویباری",
      customBlankCounts: {},
      selectedLessons: WORKSHEETS_DATA.map(s => s.id)
    };

    let appConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

    // Load from localStorage if present
    function loadSavedConfig() {
      try {
        const saved = localStorage.getItem('farsi4_worksheet_settings');
        if (saved) {
          const parsed = JSON.parse(saved);
          appConfig = Object.assign({}, DEFAULT_CONFIG, parsed);
        }
      } catch (e) {
        console.warn('Could not load localStorage settings', e);
      }
    }

    function saveConfig() {
      try {
        localStorage.setItem('farsi4_worksheet_settings', JSON.stringify(appConfig));
      } catch (e) {
        console.warn('Could not save to localStorage', e);
      }
    }

    function resetSettings() {
      if (confirm('آیا مایل به بازنشانی تمام تنظیمات به حالت اولیه هستید؟')) {
        appConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
        saveConfig();
        syncControlsWithConfig();
        renderAllWorksheets();
      }
    }

    // =========================================================================
    // Word Blanking Engine (Doubled Blank Size per User Request)
    // =========================================================================
    function makeBlankSpan(word, isTeacherMode) {
      if (isTeacherMode) {
        return `<span class="cloze-blank teacher-mode"><span class="cloze-paren">(</span><strong class="cloze-answer">${word}</strong><span class="cloze-paren">)</span></span>`;
      } else {
        // Doubled in size compared to previous compact size
        const dotWidth = Math.max(44, Math.round((word.length * 6.5 + 8) * 2));
        return `<span class="cloze-blank"><span class="cloze-paren">(</span><span class="cloze-dotted-line" style="width: ${dotWidth}px;" title="جای خالی املایی (${word.length} حرف)"></span><span class="cloze-paren">)</span></span>`;
      }
    }

    const BOUNDARY_CHARS = '[\\s،؛:!؟«»()\\\[\\\]\\-.,;?\\n\\r]';

    function escapeRegExp(string) {
      return string.split('').map(function (c) {
        return '^$*+?.()|[]\\'.indexOf(c) !== -1 ? '\\' + c : c;
      }).join('');
    }

    function applyBlanksToText(rawText, targetWords, isTeacherMode) {
      if (!rawText || !targetWords || targetWords.length === 0) return rawText;
      let text = rawText;

      targetWords.forEach(word => {
        if (!word) return;
        const escaped = escapeRegExp(word);
        const regex = new RegExp('(^|' + BOUNDARY_CHARS + ')' + escaped + '(?=' + BOUNDARY_CHARS + '|$)', 'g');
        let replacedOnce = false;
        text = text.replace(regex, function (match, prefix) {
          if (!replacedOnce) {
            replacedOnce = true;
            return prefix + makeBlankSpan(word, isTeacherMode);
          }
          return match;
        });
      });

      return text;
    }

    // =========================================================================
    // DOM Rendering Engine
    // =========================================================================
    function getBlankCountForSection(secId) {
      if (appConfig.customBlankCounts && appConfig.customBlankCounts[secId] !== undefined && appConfig.customBlankCounts[secId] !== "") {
        const c = parseInt(appConfig.customBlankCounts[secId], 10);
        if (!isNaN(c) && c > 0) return c;
      }
      return appConfig.globalBlankCount || 8;
    }

    function renderAllWorksheets() {
      const root = document.getElementById('worksheets-root');
      root.innerHTML = '';

      // Update font size variable
      document.documentElement.style.setProperty('--sheet-font-size', appConfig.fontSize);

      const activeWorksheets = WORKSHEETS_DATA.filter(s => appConfig.selectedLessons.includes(s.id));
      document.getElementById('selected-summary').innerText = `${activeWorksheets.length} کاربرگ انتخاب‌شده از ${WORKSHEETS_DATA.length} بخش`;

      if (activeWorksheets.length === 0) {
        root.innerHTML = `
          <div style="background:#fff; border:2px dashed #94a3b8; border-radius:12px; padding:40px; text-align:center; color:#475569;">
            <h3>هیچ کاربرگی برای نمایش یا چاپ انتخاب نشده است.</h3>
            <p style="margin-top:8px;">لطفاً از پنل بالای صفحه، درس‌های مورد نظر خود را تیک بزنید یا دکمه «انتخاب همه» را فشار دهید.</p>
          </div>
        `;
        return;
      }

      activeWorksheets.forEach((sec, idx) => {
        const targetCount = getBlankCountForSection(sec.id);
        const targetWords = (sec.spellingWords || []).slice(0, targetCount);

        const pageEl = document.createElement('article');
        pageEl.className = 'worksheet-page';
        pageEl.id = `page-${sec.id}`;

        // 1. Sleek Compact Header + Sub-header Credit (No Footers)
        const headerHTML = `
          <header class="sheet-header">
            <div class="header-top-row">
              <div class="header-right">
                <div>جمهوری اسلامی ایران</div>
                <div>آموزش و پرورش شهرستان جویبار</div>
              </div>
              <div class="header-center">
                <div class="sheet-main-title">کاربرگ املای آموزشی (جای‌خالی)</div>
                <div class="sheet-sub-title">پایه چهارم ابتدایی — سال تحصیلی ۱۴۰۶-۱۴۰۵</div>
                ${appConfig.teacherMode ? '<span class="teacher-badge">نسخه‌ی راهنمای آموزگار (پاسخنامه)</span>' : ''}
              </div>
              <div class="header-left">
                <div><strong>دبستان:</strong> <span class="school-name-text">${appConfig.schoolName || 'شهید قائمی پائین‌رودپشت'}</span></div>
                <div><strong>آموزگار:</strong> <span class="teacher-name-text">${appConfig.teacherName || 'علی یعقوبی جویباری'}</span></div>
              </div>
            </div>

            <div class="header-meta-row">
              <div class="meta-item student-name">
                <span class="meta-label">نام و نام خانوادگی:</span>
                <span class="meta-dots"></span>
              </div>
              <div class="meta-item">
                <span class="meta-label"></span>
<span class="meta-val">${sec.title.replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d])}</span>
              </div>
              <div class="meta-item">
                <span class="meta-label"></span>
                <span class="meta-val"></span>
              </div>
              <div class="meta-item">
                <span class="meta-label">تاریخ:</span>
                <span class="meta-dots date-dots"></span>
              </div>
            </div>

            <div class="header-eval-row">
              <div class="eval-levels">
                <span class="meta-label">ارزشیابی توصیفی:</span>
                <span class="eval-grade">خیلی خوب <i class="eval-circle"></i></span>
                <span class="eval-grade">خوب <i class="eval-circle"></i></span>
                <span class="eval-grade">قابل قبول <i class="eval-circle"></i></span>
                <span class="eval-grade">نیازمند تلاش <i class="eval-circle"></i></span>
              </div>
              <div class="meta-item" style="flex: 1; max-width: 280px; justify-content: flex-end;">
                <span class="meta-label">امضا و بازخورد آموزگار:</span>
                <span class="meta-dots sig-dots"></span>
              </div>
            </div>
          </header>

          <div class="sub-header-credit">
            طراحی شده توسط سامانه www.ali.id.ir
          </div>

          <div class="instruction-line">
            <span>✏️</span>
            <span><strong>دستور کار:</strong> متن زیر را با دقّت بخوانید و با توجّه به املای صحیح، جاهای خالی <strong>( · · · · · )</strong> را کامل کنید.</span>
          </div>
        `;

        // 2. Content Body
        const alignClass = (appConfig.textAlign === 'justify') ? 'align-justify' : 'align-right';
        let bodyHTML = `<div class="sheet-body ${alignClass}">`;

        if (sec.contentType === 'poem') {
          bodyHTML += '<div class="poem-container">';
          if (sec.verses && sec.verses.length > 0) {
            sec.verses.forEach(v => {
              const m1Blanked = applyBlanksToText(v.hemistich_1, targetWords, appConfig.teacherMode);
              const m2Blanked = applyBlanksToText(v.hemistich_2, targetWords, appConfig.teacherMode);
              bodyHTML += `
                <div class="couplet-row">
                  <div class="hemistich hemistich-1">${m1Blanked}</div>
                  <div class="hemistich hemistich-2">${m2Blanked}</div>
                </div>
              `;
            });
          } else if (sec.stanzas && sec.stanzas.length > 0) {
            sec.stanzas.forEach(st => {
              bodyHTML += '<div class="stanza-block">';
              st.lines.forEach(l => {
                const lineBlanked = applyBlanksToText(l, targetWords, appConfig.teacherMode);
                bodyHTML += `<div>${lineBlanked}</div>`;
              });
              bodyHTML += '</div>';
            });
          } else if (sec.lines && sec.lines.length > 0) {
            bodyHTML += '<div class="stanza-block" style="text-align: center;">';
            sec.lines.forEach(l => {
              const lineBlanked = applyBlanksToText(l, targetWords, appConfig.teacherMode);
              bodyHTML += `<div>${lineBlanked}</div>`;
            });
            bodyHTML += '</div>';
          }
          bodyHTML += '</div>';
        } else {
          // Prose content
          (sec.paragraphs || []).forEach(p => {
            const pBlanked = applyBlanksToText(p, targetWords, appConfig.teacherMode);
            bodyHTML += `<p class="prose-paragraph">${pBlanked}</p>`;
          });
        }

        // Optional Word Bank
        if (appConfig.wordBank === 'show' && targetWords.length > 0) {
          const shuffled = [...targetWords].sort(() => 0.5 - Math.random());
          bodyHTML += `
            <div class="word-bank-box">
              <div class="word-bank-title">💡 جعبه کلمات راهنما (کلمات جای‌خالی به صورت درهم‌ریخته):</div>
              <div class="word-bank-chips">
                ${shuffled.map(w => `<span class="word-chip">${w}</span>`).join('')}
              </div>
            </div>
          `;
        }

        bodyHTML += '</div>';

        // Set worksheet innerHTML (No footers whatsoever)
        pageEl.innerHTML = headerHTML + bodyHTML;
        root.appendChild(pageEl);
      });
    }

    // =========================================================================
    // Control Handlers
    // =========================================================================
    function onGlobalSliderChange(val) {
      document.getElementById('global-blank-number').value = val;
      appConfig.globalBlankCount = parseInt(val, 10);
      saveConfig();
      renderAllWorksheets();
    }

    function onGlobalNumberChange(val) {
      document.getElementById('global-blank-slider').value = val;
      appConfig.globalBlankCount = parseInt(val, 10);
      saveConfig();
      renderAllWorksheets();
    }

    function onSchoolNameChange(val) {
      appConfig.schoolName = val.trim();
      saveConfig();
      document.querySelectorAll('.school-name-text').forEach(el => {
        el.innerText = appConfig.schoolName || 'شهید قائمی پائین‌رودپشت';
      });
    }

    function onTeacherNameChange(val) {
      appConfig.teacherName = val.trim();
      saveConfig();
      document.querySelectorAll('.teacher-name-text').forEach(el => {
        el.innerText = appConfig.teacherName || 'علی یعقوبی جویباری';
      });
    }

    function onTextAlignChange(val) {
      appConfig.textAlign = val;
      saveConfig();
      renderAllWorksheets();
    }

    function toggleTeacherMode() {
      appConfig.teacherMode = !appConfig.teacherMode;
      saveConfig();
      syncTeacherButton();
      renderAllWorksheets();
    }

    function syncTeacherButton() {
      const btn = document.getElementById('btn-toggle-teacher');
      const txt = document.getElementById('teacher-status-text');
      if (appConfig.teacherMode) {
        btn.classList.add('active');
        txt.innerText = 'روشن (پاسخنامه)';
      } else {
        btn.classList.remove('active');
        txt.innerText = 'خاموش';
      }
    }

    function onWordBankChange(val) {
      appConfig.wordBank = val;
      saveConfig();
      renderAllWorksheets();
    }

    function onFontSizeChange(val) {
      appConfig.fontSize = val;
      saveConfig();
      renderAllWorksheets();
    }

    function toggleDrawer() {
      const drawer = document.getElementById('drawer-container');
      drawer.style.display = drawer.style.display === 'none' ? 'grid' : 'none';
    }

    function selectAllLessons(select) {
      if (select) {
        appConfig.selectedLessons = WORKSHEETS_DATA.map(s => s.id);
      } else {
        appConfig.selectedLessons = [];
      }
      saveConfig();
      syncDrawerCheckboxes();
      renderAllWorksheets();
    }

    function filterByChapter(ch) {
      if (ch === 'all') {
        appConfig.selectedLessons = WORKSHEETS_DATA.map(s => s.id);
      } else {
        appConfig.selectedLessons = WORKSHEETS_DATA.filter(s => s.chapter.includes(ch)).map(s => s.id);
      }
      saveConfig();
      syncDrawerCheckboxes();
      renderAllWorksheets();
    }

    function onLessonCheckboxChange(secId, isChecked) {
      if (isChecked) {
        if (!appConfig.selectedLessons.includes(secId)) {
          appConfig.selectedLessons.push(secId);
        }
      } else {
        appConfig.selectedLessons = appConfig.selectedLessons.filter(id => id !== secId);
      }
      saveConfig();
      renderAllWorksheets();
    }

    function onLessonCustomCountChange(secId, val) {
      if (!appConfig.customBlankCounts) appConfig.customBlankCounts = {};
      if (val === "" || val === null) {
        delete appConfig.customBlankCounts[secId];
      } else {
        appConfig.customBlankCounts[secId] = parseInt(val, 10);
      }
      saveConfig();
      renderAllWorksheets();
    }

    function populateDrawer() {
      const drawer = document.getElementById('drawer-container');
      drawer.innerHTML = '';

      WORKSHEETS_DATA.forEach(sec => {
        const isChecked = appConfig.selectedLessons.includes(sec.id);
        const customCount = (appConfig.customBlankCounts && appConfig.customBlankCounts[sec.id] !== undefined) ? appConfig.customBlankCounts[sec.id] : '';

        const itemEl = document.createElement('div');
        itemEl.className = 'lesson-checkbox-label';
        itemEl.innerHTML = `
          <input type="checkbox" id="chk-${sec.id}" ${isChecked ? 'checked' : ''} onchange="onLessonCheckboxChange('${sec.id}', this.checked)">
          <label for="chk-${sec.id}" style="cursor:pointer; flex:1;" title="${sec.chapter}">${sec.title}</label>
          <input type="number" class="lesson-custom-input" min="1" max="25" placeholder="${appConfig.globalBlankCount}" value="${customCount}" title="تعداد جای خالی اختصاصی این درس (خالی = سراسری)" onchange="onLessonCustomCountChange('${sec.id}', this.value)">
        `;
        drawer.appendChild(itemEl);
      });
    }

    function syncDrawerCheckboxes() {
      WORKSHEETS_DATA.forEach(sec => {
        const chk = document.getElementById(`chk-${sec.id}`);
        if (chk) {
          chk.checked = appConfig.selectedLessons.includes(sec.id);
        }
      });
    }

    function syncControlsWithConfig() {
      document.getElementById('global-blank-slider').value = appConfig.globalBlankCount;
      document.getElementById('global-blank-number').value = appConfig.globalBlankCount;
      document.getElementById('input-school-name').value = appConfig.schoolName || 'شهید قائمی پائین‌رودپشت';
      document.getElementById('input-teacher-name').value = appConfig.teacherName || 'علی یعقوبی جویباری';
      document.getElementById('select-text-align').value = appConfig.textAlign || 'right';
      document.getElementById('select-word-bank').value = appConfig.wordBank;
      document.getElementById('select-font-size').value = appConfig.fontSize;
      syncTeacherButton();
      populateDrawer();
    }

    // =========================================================================
    // Initialization
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedConfig();
      syncControlsWithConfig();
      renderAllWorksheets();
    });
  </script>
</body>

</html>
